name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: node --test tests/shared-domain.test.js
      - run: node --test tests/shared-domain-extra.test.js
      - run: node --test tests/server-api.test.js
      - run: node --test tests/server-api-extra.test.js
      - run: node --test tests/pwa-ui.test.js
      - run: node --test tests/pwa-ui-extra.test.js
      - run: node scripts/verify-docs-and-bundle.mjs

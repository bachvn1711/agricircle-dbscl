<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#15803D">
  <meta name="color-scheme" content="light">
  <title>Nông sản Tuần hoàn - Xuân Đường</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="/styles/app.css">
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button type="button" class="brand-btn" id="brand-home-btn" aria-label="Về trang chủ bản đồ">
        <img src="/icons/icon-192.svg" alt="" width="28" height="28" class="brand-icon">
        <span class="brand-text-wrap">
          <span class="brand-title">AgriCircle</span>
          <span class="brand-badge">Xuân Đường</span>
        </span>
      </button>
      <nav class="desktop-nav" aria-label="Điều hướng chính">
        <button type="button" class="nav-btn is-active" data-tab="map" aria-current="page">Bản đồ</button>
        <button type="button" class="nav-btn" data-tab="post">Đăng tin</button>
        <button type="button" class="nav-btn" data-tab="calc">Tính giá</button>
        <button type="button" class="nav-btn" data-tab="impact">Tác động</button>
      </nav>
      <div class="header-actions">
        <div class="region-select-wrap">
          <label class="sr-only" for="region-select">Chọn khu vực</label>
          <select id="region-select" class="region-select" aria-label="Chọn khu vực"></select>
        </div>
        <button type="button" class="nav-btn admin-nav-btn" id="header-admin-btn" data-tab="admin">Quản trị</button>
      </div>
    </div>
  </header>

  <div id="global-status-strip" class="status-strip" hidden role="status" aria-live="polite"></div>

  <main id="app-main" class="app-main">
    <section id="view-map" class="view-panel" aria-labelledby="heading-map"></section>
    <section id="view-post" class="view-panel" aria-labelledby="heading-post" hidden></section>
    <section id="view-calc" class="view-panel" aria-labelledby="heading-calc" hidden></section>
    <section id="view-impact" class="view-panel" aria-labelledby="heading-impact" hidden></section>
    <section id="view-admin" class="view-panel" aria-labelledby="heading-admin" hidden></section>
  </main>

  <nav class="bottom-nav" aria-label="Thanh chuyển màn hình nhanh">
    <button type="button" class="bottom-nav-btn is-active" data-tab="map" aria-current="page">
      <span class="bottom-nav-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="3 6 9 3 15 6 21 3 21 18 15 21 9 18 3 21"></polygon><line x1="9" y1="3" x2="9" y2="18"></line><line x1="15" y1="6" x2="15" y2="21"></line></svg>
      </span>
      <span class="bottom-nav-label">Bản đồ</span>
    </button>
    <button type="button" class="bottom-nav-btn" data-tab="post">
      <span class="bottom-nav-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
      </span>
      <span class="bottom-nav-label">Đăng tin</span>
    </button>
    <button type="button" class="bottom-nav-btn" data-tab="calc">
      <span class="bottom-nav-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="2" width="16" height="20" rx="2"></rect><line x1="8" y1="6" x2="16" y2="6"></line><line x1="16" y1="14" x2="16" y2="18"></line><path d="M16 10h.01"></path><path d="M12 10h.01"></path><path d="M8 10h.01"></path><path d="M12 14h.01"></path><path d="M8 14h.01"></path><path d="M12 18h.01"></path><path d="M8 18h.01"></path></svg>
      </span>
      <span class="bottom-nav-label">Tính giá</span>
    </button>
    <button type="button" class="bottom-nav-btn" data-tab="impact">
      <span class="bottom-nav-icon" aria-hidden="true">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      </span>
      <span class="bottom-nav-label">Tác động</span>
    </button>
  </nav>

  <script src="/vendor/leaflet/leaflet.js"></script>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
